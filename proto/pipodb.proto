syntax = "proto3";

package pipodb;

service VectorDBService {
  rpc HealthCheck (HealthRequest) returns (HealthResponse);
  rpc ListCollections (ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc CreateCollection (CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc DropCollection (DropCollectionRequest) returns (DropCollectionResponse);
  rpc InsertVector (InsertVectorRequest) returns (InsertVectorResponse);
  rpc UpsertVector (UpsertVectorRequest) returns (UpsertVectorResponse);
  rpc DeleteVector (DeleteVectorRequest) returns (DeleteVectorResponse);
  rpc Search (SearchRequest) returns (SearchResponse);
}

message HealthRequest {}
message HealthResponse {
  string status = 1;
  string version = 2;
}

message ListCollectionsRequest {}
message ListCollectionsResponse {
  repeated string collections = 1;
}

message CreateCollectionRequest {
  string name = 1;
  uint64 dimension = 2;
  string metric = 3;      // "L2", "COSINE", "IP"
  string index_type = 4;  // "HNSW", "FLAT"
  uint64 M = 5;
}

message CreateCollectionResponse {
  bool success = 1;
  string error_message = 2;
}

message DropCollectionRequest {
  string name = 1;
}

message DropCollectionResponse {
  bool success = 1;
  string error_message = 2;
}

message InsertVectorRequest {
  string collection_name = 1;
  uint64 id = 2; // 0 for auto-generation
  repeated float vector = 3;
  string payload_json = 4;
}

message InsertVectorResponse {
  uint64 id = 1;
  bool success = 2;
  string error_message = 3;
}

message UpsertVectorRequest {
  string collection_name = 1;
  repeated float vector = 2;
  string payload_json = 3;
  float distance_threshold = 4;
  uint64 explicit_id = 5;
}

message UpsertVectorResponse {
  uint64 id = 1;
  bool is_updated = 2;
  float distance = 3;
  bool success = 4;
  string error_message = 5;
}

message DeleteVectorRequest {
  string collection_name = 1;
  uint64 id = 2;
}

message DeleteVectorResponse {
  bool success = 1;
  string error_message = 2;
}

message SearchRequest {
  string collection_name = 1;
  repeated float vector = 2;
  int32 top_k = 3;
  bool include_payload = 4;
}

message SearchHit {
  uint64 id = 1;
  float distance = 2;
  string payload_json = 3;
}

message SearchResponse {
  repeated SearchHit hits = 1;
  double query_time_ms = 2;
  bool success = 3;
  string error_message = 4;
}
